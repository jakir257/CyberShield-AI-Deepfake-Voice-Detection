{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset password | CyberShield AI</title>
    <link rel="stylesheet" href="{% static 'cyber/style.css' %}?v=17">
    <script>
        (function () {
            try {
                var t = localStorage.getItem("cybershield-theme");
                if (t === "light" || t === "dark") {
                    document.documentElement.setAttribute("data-theme", t);
                }
            } catch (e) {}
        })();
    </script>
</head>
<body class="text-slate-200">
    <div id="auth-container" class="min-h-screen flex items-center justify-center p-4">
        <div class="glass-card">
            <div class="text-center">
                <h1>CYBERSHIELD <span>AI</span></h1>
                <p>Cybercrime Detection Platform</p>
            </div>

            <h2>Reset your password</h2>
            <p>Enter the email on your account and we will send a reset link.</p>
            <form method="post">
                {% csrf_token %}
                <div>
                    <label>Email address</label>
                    {{ form.email }}
                </div>
                {% if form.errors %}<p class="auth-error">Enter a valid email address.</p>{% endif %}
                <button type="submit">Send reset link</button>
            </form>
            <p class="text-center"><a href="{% url 'signin_page' %}">Back to sign in</a></p>

        </div>
    </div>
</body>
</html>

{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password changed | CyberShield AI</title>
    <link rel="stylesheet" href="{% static 'cyber/style.css' %}?v=17">
    <script>
        (function () {
            try {
                var t = localStorage.getItem("cybershield-theme");
                if (t === "light" || t === "dark") {
                    document.documentElement.setAttribute("data-theme", t);
                }
            } catch (e) {}
        })();
    </script>
</head>
<body class="text-slate-200">
    <div id="auth-container" class="min-h-screen flex items-center justify-center p-4">
        <div class="glass-card">
            <div class="text-center">
                <h1>CYBERSHIELD <span>AI</span></h1>
                <p>Cybercrime Detection Platform</p>
            </div>

            <h2>Password changed</h2>
            <p>You can sign in with your new password now.</p>
            <p class="text-center"><a href="{% url 'signin_page' %}">Go to sign in</a></p>

        </div>
    </div>
</body>
</html>
